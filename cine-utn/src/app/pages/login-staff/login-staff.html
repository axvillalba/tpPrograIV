<div class="staff-auth-container">
  <div class="staff-spotlight"></div>

  <div class="card bg-dark-card staff-auth-card p-4 p-md-5 animate-fade-in">
    <div class="text-center mb-4">
      <div class="staff-shield-badge mx-auto mb-3">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <span class="staff-tag d-block mb-1">PORTAL INTERNO</span>
      <h3 class="text-white fw-bold mb-1">Acceso <span class="text-danger">Staff</span></h3>
      <p class="text-secondary small m-0">Exclusivo para Gerencia y Empleados de Cine UTN</p>
    </div>

    @if (errorMensaje()) {
      <div class="staff-error-alert py-2 px-3 small fw-semibold mb-3 rounded-3">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ errorMensaje() }}
      </div>
    }

    <form (ngSubmit)="iniciarSesionStaff()">
      <div class="mb-3">
        <label class="form-label small text-light fw-medium">Correo Institucional</label>
        <div class="input-group staff-input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input 
            type="email" 
            class="form-control" 
            placeholder="usuario@cineutn.com"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            name="email"
            required>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label small text-light fw-medium">Contraseña</label>
        <div class="input-group staff-input-group">
          <span class="input-group-text"><i class="bi bi-key"></i></span>
          <input 
            type="password" 
            class="form-control" 
            placeholder="••••••••"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            name="password"
            required>
        </div>
      </div>

      <button 
        type="submit" 
        class="btn btn-danger-custom btn-lg w-100 mb-3 py-2" 
        [disabled]="cargando() || !email() || !password()">
        @if (cargando()) {
          <span class="spinner-border spinner-border-sm me-2"></span> Autenticando...
        } @else {
          <i class="bi bi-box-arrow-in-right me-2"></i> Ingresar al Portal
        }
      </button>

      <button 
        type="button" 
        class="btn btn-back-client btn-sm w-100 py-2" 
        (click)="volverAlLoginCliente()">
        <i class="bi bi-arrow-left me-1"></i> Volver a la Vista de Clientes
      </button>
    </form>
  </div>
</div>
