<div class="auth-container">
  <div class="auth-spotlight"></div>

  <div class="auth-card animate-fade-in">
    <!-- Cabecera de Marca Cinematográfica -->
    <div class="auth-brand-header">
      <div class="auth-logo-badge">
        <i class="bi bi-film"></i>
      </div>
      <span class="auth-brand-tag">CINE UTN</span>
    </div>

    <h2>{{ modoRegistro() ? 'Crear Cuenta' : 'Iniciar Sesión' }}</h2>
    <p class="subtitle">
      {{ modoRegistro() ? 'Registrate y obtené un 20% OFF en tu primera compra' : 'Ingresá para gestionar tus entradas y beneficios' }}
    </p>

    @if (mensajeError()) {
      <div class="error-alert">
        <i class="bi bi-exclamation-circle-fill me-2"></i>{{ mensajeError() }}
      </div>
    }

    <form [formGroup]="authForm" (ngSubmit)="onSubmit()">
      <!-- Campos Básicos -->
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" formControlName="email" placeholder="ejemplo@correo.com">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" formControlName="password" placeholder="••••••••">
      </div>

      <!-- Campos Exclusivos de Registro -->
      @if (modoRegistro()) {
        <div class="form-row">
          <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" formControlName="nombre" placeholder="Juan">
          </div>
          <div class="form-group">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" formControlName="apellido" placeholder="Pérez">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="fechaNacimiento">Fecha de Nacimiento</label>
            <input type="date" id="fechaNacimiento" formControlName="fechaNacimiento">
          </div>
          <div class="form-group">
            <label for="tipoSangre">Tipo de Sangre</label>
            <select id="tipoSangre" formControlName="tipoSangre">
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="colorOjos">Color de Ojos</label>
            <input type="text" id="colorOjos" formControlName="colorOjos" placeholder="Ej: Marrón">
          </div>
          <div class="form-group">
            <label for="diasVacaciones">Días de Vacaciones / Año</label>
            <input type="number" id="diasVacaciones" formControlName="diasVacaciones" min="0">
          </div>
        </div>
      }

      <button type="submit" class="btn-primary" [disabled]="cargando()">
        {{ cargando() ? 'Procesando...' : (modoRegistro() ? 'Completar Registro' : 'Ingresar a la Sala') }}
      </button>
    </form>

    <div class="auth-actions">
      <button type="button" class="btn-link" (click)="toggleModo()">
        {{ modoRegistro() ? '¿Ya tenés cuenta? Iniciá sesión' : '¿No tenés cuenta? Registrate acá' }}
      </button>

      <div class="auth-divider">
        <span>o continuá con</span>
      </div>

      <button type="button" class="btn-secondary" (click)="ingresarComoAnonimo()">
        <i class="bi bi-ticket-perforated me-2"></i>Continuar como invitado (Anónimo)
      </button>

      <!-- Acceso Staff -->
      <button type="button" class="btn-staff" (click)="irALoginStaff()">
        <i class="bi bi-person-badge me-2"></i>¿Usted trabaja acá? Acceso Staff
      </button>
    </div>
  </div>
</div>
