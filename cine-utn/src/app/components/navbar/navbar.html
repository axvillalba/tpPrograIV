<nav class="navbar navbar-expand-lg navbar-cinema sticky-top px-3 px-md-4 py-2">
  <div class="container-fluid max-w-navbar">
    
    <!-- Izquierda: Botón Volver + Marca Cine UTN -->
    <div class="d-flex align-items-center gap-3">
      <button class="btn btn-back-cinema btn-sm" (click)="volver()" title="Volver atrás">
        <i class="bi bi-arrow-left"></i>
        <span class="d-none d-sm-inline ms-1">Volver</span>
      </button>

      <a class="navbar-brand brand-cinema d-flex align-items-center gap-2 m-0" routerLink="/cartelera">
        <span class="brand-icon-box">
          <i class="bi bi-film"></i>
        </span>
        <span class="brand-text">
          CINE <span class="text-danger">UTN</span>
        </span>
      </a>
    </div>

    <!-- Derecha: Datos del Usuario / Acciones -->
    <div class="d-flex align-items-center ms-auto gap-2">
      @if (authService.currentUser(); as user) {
        <a routerLink="/perfil" class="btn btn-user-pill btn-sm d-flex align-items-center gap-2" title="Ir a Mi Perfil">
          <span class="user-avatar-dot">
            <i class="bi bi-person-fill"></i>
          </span>
          <span class="user-email-text text-truncate">{{ user.email }}</span>
        </a>

        <button class="btn btn-logout-cinema btn-sm" (click)="logout()" title="Cerrar Sesión">
          <i class="bi bi-box-arrow-right"></i>
          <span class="d-none d-md-inline ms-1">Salir</span>
        </button>
      } @else {
        <span class="badge-guest d-none d-sm-inline-flex align-items-center gap-1">
          <i class="bi bi-incognito"></i> Invitado
        </span>
        <a class="btn btn-danger-custom btn-sm px-3" routerLink="/login">
          Iniciar Sesión
        </a>
      }
    </div>

  </div>
</nav>
